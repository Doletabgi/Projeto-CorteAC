name: Build CorteAC Windows (.exe)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Executável Windows 10/11
    runs-on: windows-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Executar Testes Unitários
        run: |
          python -m unittest discover -s tests

      - name: Compilar Executável Standalone com PyInstaller
        run: |
          pyinstaller --clean --onefile --noconsole --icon "assets/app_icon.ico" --add-data "assets;assets" --add-data "samples;samples" --add-data "jobmanager.db;." --add-data "db.example.ini;." --hidden-import pymysql --hidden-import cryptography --name "CorteAC" main.py

      - name: Empacotar Pacote Portátil ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package\CorteAC" -Force
          Copy-Item "dist\CorteAC.exe" -Destination "dist_package\CorteAC\"
          Copy-Item "README_WINDOWS.txt" -Destination "dist_package\CorteAC\"
          Copy-Item "db.example.ini" -Destination "dist_package\CorteAC\"
          Compress-Archive -Path "dist_package\CorteAC\*" -DestinationPath "dist\CorteAC-Windows-x64.zip"

      - name: Publicar Artefatos no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CorteAC-Windows-x64
          path: |
            dist/CorteAC.exe
            dist/CorteAC-Windows-x64.zip
          retention-days: 30

      - name: Criar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2026.1-win' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'CorteAC v2026.1 (Windows 10 / 11)' }}
          body: |
            ## CorteAC para Windows 10 e Windows 11
            
            Versão executável pronta para download e testes em qualquer computador com **Windows 10** ou **Windows 11**.
            
            ### 📥 Como Baixar e Testar:
            1. Baixe o pacote **`CorteAC-Windows-x64.zip`** (ou o arquivo **`CorteAC.exe`**) abaixo na seção **Assets**.
            2. Extraia o arquivo zip em qualquer pasta (ex: Área de Trabalho ou `C:\CorteAC`).
            3. Dê dois cliques em **`CorteAC.exe`**.
            4. O sistema iniciará imediatamente! O banco de dados local SQLite (`jobmanager.db`) será inicializado automaticamente na pasta.
            
            > **Observação:** Não é necessário instalar Python, bibliotecas ou dependências adicionais.
          files: |
            dist/CorteAC.exe
            dist/CorteAC-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
