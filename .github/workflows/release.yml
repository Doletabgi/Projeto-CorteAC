            - **Correção crítica: cache geométrico podia devolver o polígono de outro molde**:
              - O cache de transformação de contornos era indexado pelo endereço de memória da lista, sem validar o conteúdo. Como o Python recicla endereços, após muitas sessões o editor/nesting podia usar a geometria de outra peça — desenhos deformados, colisões falsas e risco de posicionamento errado.
              - Cada entrada passou a ser validada por tamanho e por 3 vértices de referência: reciclagem de endereço agora é apenas um cache miss, nunca um resultado errado.
              - Detectado pelo fuzz test de 1.000 pares, que falhava de forma intermitente; novos testes reproduzem o defeito no código antigo e validam a correção.
