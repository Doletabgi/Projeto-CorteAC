name: Release CorteAC (Windows & Linux)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão SemVer (ex: v1.0.0)'
        required: false
        default: 'v1.6.38'

permissions:
  contents: write

# master, main e a tag disparam o mesmo release: serializa para não criar/atualizar
# a release em paralelo (era a causa de falhas e de assets faltando).
concurrency:
  group: corteac-release
  cancel-in-progress: false

jobs:
  build-windows:
    name: Compilar Binário Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Limpar Banco de Dados para Release
        run: |
          python tools/clean_database.py

      - name: Compilar Executável Standalone com PyInstaller
        run: |
          pyinstaller --clean --onefile --noconsole --icon "assets/app_icon.ico" --add-data "assets;assets" --add-data "samples;samples" --add-data "jobmanager.db;." --add-data "db.example.ini;." --hidden-import pymysql --hidden-import cryptography --hidden-import cad.project_packager --hidden-import cad.barcode --hidden-import cad.layout_converter --hidden-import cad.czlib --hidden-import cad.onx_exporter --hidden-import cad.dual_exporter --hidden-import ui.user_dialog --hidden-import ui.layout_converter_dialog --name "CorteAC" main.py

      - name: Empacotar Pacote Portátil ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package\CorteAC" -Force
          Copy-Item "dist\CorteAC.exe" -Destination "dist_package\CorteAC\"
          Copy-Item "README_WINDOWS.txt" -Destination "dist_package\CorteAC\"
          Copy-Item "db.example.ini" -Destination "dist_package\CorteAC\"
          Copy-Item "packaging\criar_atalho_windows.ps1" -Destination "dist_package\CorteAC\"
          python -c "import config; open('dist_package/CorteAC/versao.txt','w').write(config.APP_VERSION)"
          python -c "import config; open('versao.txt','w').write(config.APP_VERSION)"
          Compress-Archive -Path "dist_package\CorteAC\*" -DestinationPath "dist\CorteAC-Windows-x64.zip"

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/CorteAC.exe
            dist/CorteAC-Windows-x64.zip
          retention-days: 7

  build-linux:
    name: Compilar Binário Linux (Standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Limpar Banco de Dados para Release
        run: |
          python3 tools/clean_database.py

      - name: Compilar Executável Standalone Linux com PyInstaller
        run: |
          pyinstaller --clean --onefile --add-data "assets:assets" --add-data "samples:samples" --add-data "jobmanager.db:." --add-data "db.example.ini:." --hidden-import pymysql --hidden-import cryptography --hidden-import cad.project_packager --hidden-import cad.barcode --hidden-import cad.layout_converter --hidden-import cad.czlib --hidden-import cad.onx_exporter --hidden-import cad.dual_exporter --hidden-import ui.user_dialog --hidden-import ui.layout_converter_dialog --name "corteac_linux" main.py

      - name: Empacotar Pacote Portátil TAR.GZ
        run: |
          mkdir -p dist_linux/CorteAC
          cp dist/corteac_linux dist_linux/CorteAC/
          cp README_LINUX.txt dist_linux/CorteAC/
          cp run.sh dist_linux/CorteAC/
          cp db.example.ini dist_linux/CorteAC/
          cp assets/app_icon.png dist_linux/CorteAC/corteac.png
          VERSAO_APP="$(python3 -c "import config; print(config.APP_VERSION)")"
          sed "s/@VERSAO@/${VERSAO_APP}/g" packaging/instalar_atalho.sh > dist_linux/CorteAC/instalar_atalho.sh
          chmod +x dist_linux/CorteAC/corteac_linux dist_linux/CorteAC/run.sh dist_linux/CorteAC/instalar_atalho.sh
          tar -czf dist/CorteAC-Linux-x64.tar.gz -C dist_linux CorteAC

      - name: Upload Artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/corteac_linux
            dist/CorteAC-Linux-x64.tar.gz
          retention-days: 7

  publish-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Código para Referência
        uses: actions/checkout@v4

      - name: Criar Diretório de Distribuição
        run: mkdir -p dist-release

      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/windows

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release/linux

      - name: Determinar Nome da Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import config; print(config.APP_VERSION)")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CorteAC ${{ steps.release_tag.outputs.tag }} (Windows & Linux)
          # Sem allowUpdates o run que encontra a release já criada FALHA
          # (era o caso dos pushes de master/main/tag na mesma versão).
          allowUpdates: true
          overwrite_files: true
          body: |
            # CorteAC — Lançamento Oficial para Windows 10/11 e Linux 64-bit

            Versões executáveis compiladas e prontas para testes em produção. Não é necessário instalar Python nem configurar terminal.

            ---

            ### 🪟 Para Usuários Windows (Windows 10 e Windows 11):
            1. Baixe o pacote **`CorteAC-Windows-x64.zip`** (ou diretamente o **`CorteAC.exe`**) abaixo na seção **Assets**.
            2. Extraia o `.zip` em qualquer pasta (ex: Área de Trabalho ou `C:\CorteAC`).
            3. Dê dois cliques no **`CorteAC.exe`**.
            4. O banco SQLite local (`jobmanager.db`) é inicializado automaticamente na pasta ao iniciar.

            *Nota SmartScreen: Se o Windows exibir a tela de proteção, clique em "Mais informações" e depois em "Executar assim mesmo".*

            ---

            ### 🐧 Para Usuários Linux (Ubuntu, Mint, Debian, Fedora, etc.):
            1. Baixe o pacote **`CorteAC-Linux-x64.tar.gz`** (ou diretamente o **`corteac_linux`**).
            2. Extraia os arquivos e no terminal execute:
               ```bash
               chmod +x ./corteac_linux
               ./corteac_linux
               ```
            3. O sistema abre a interface gráfica nativa imediatamente.

            ---

            ### 🛠️ Recursos Incluídos Nesta Versão (v1.6.36):
            - **Adição de Moldes de Pastas Externas no Layout Editor (v1.6.36)**:
              - Botão **(+)** (`btn_add`) na barra de ferramentas do Layout Editor para adicionar moldes que estão fora do layout.
              - Seleção de pasta no catálogo ou banco de dados via combobox `Pasta:` (`faca`, `807266`, etc.) com filtragem instantânea na árvore de moldes.
              - Importação direta de moldes do computador através do botão `📂 Do Disco (.die)...` com suporte a arquivos `.die` e `.d` de qualquer diretório.
              - Menu de contexto no clique com botão direito do mouse no botão **(+)** para acesso rápido (*📁 Escolher Shape por Pasta (Catálogo)...* ou *📂 Escolher Arquivo(s) .die no Disco...*).
              - Inserção imediata da peça na mesa de corte (`placed_pieces`), registro nos alvos da barra lateral (`sidebar_targets`) e preservação integral de contornos, furos (`holes`), costuras (`stitching`) e recortes internos (`internal_cuts`).
            - **Suporte a Múltiplos Moldes e Rotação Sincronizada no Shape Editor (v1.6.36)**:
              - Abertura simultânea de múltiplos moldes no Shape Editor com barra de abas (`tabs_bar`) e fechamento de aba individual.
              - Modo de sobreposição (`👁️ Sobrepor`) para visualização simultânea de todos os moldes abertos.
              - Ferramenta de rotação sincronizada (`🔄 Girar`): rotaciona todos os moldes abertos/selecionados simultaneamente em torno do baricentro conjunto, com exibição do ponto pivô e ângulo contínuo na barra de status.
            - **Limpeza de Menus e Opções Legadas (v1.6.36)**:
              - Remoção de `📁 Criar Subpasta de Produção...` do menu Ferramentas.
              - Remoção da caixa Xfer/Remoto (`Login`, `Password`, `Remote root folder`) e dos 3 idiomas não utilizados do diálogo de Opções.
            - **630 testes automatizados** (628 passando, 2 skip, 100% de sucesso).

            ---

            ### 📦 Recursos Anteriores:
            - **Cadastro de Usuários / Operadores e Nome na Folha de Impressão (v1.6.35)**:
              - Novo diálogo modal de cadastro e gerenciamento de operadores (`UserManagementDialog`).
              - Suporte completo a múltiplos operadores, seleção de usuário ativo com 1 clique e persistência no banco SQLite e MySQL (`users` table e `settings`).
              - Exibição destacada em negrito monoespaçado do **nome do operador logo abaixo do título** (`lay0000.lay (Placa 1 de 2)`) em todas as impressões físicas, visualizações e PDFs gerados.
              - Formato configurável: `Usuário: [Nome]`, `Operador: [Nome]` ou apenas o nome direto.
              - Acesso direto pelo menu **Ferramentas ➔ 👤 Cadastrar Usuário...**, pelo painel interativo na barra de status da janela principal e pelo botão **👤 Usuário...** na barra de ferramentas de impressão.
            - **Código de Barras Code 128 nas Impressões e Leitura Automática (v1.6.35)**:
              - Motor nativo em Python puro `cad/barcode.py` (Subset B, ISO/IEC 15417, 107 padrões, checksum mod 103 e margens silenciosas regulamentares).
              - Impressão automática do código de barras no topo direito da folha A4 com payload `CAC:SESS:<id>` (ou `:LAY:<idx>`) e rótulo legível em português.
              - Leitor global USB HID (keyboard-wedge) na `MainWindow` que captura rajadas (< 120 ms) e abre instantaneamente a sessão e placa correspondente.
              - Atalho de teclado `<F8>` e item de menu em Arquivo para abertura manual ou via scanner.
            - **Reorganização do Design da Folha de Impressão (v1.6.35)**:
              - Tabela de moldes e pares (`323_PalAcb #41`, tamanhos e nota de rodapé) movida para card com borda arredondada na lateral direita da folha no espaço em branco ao lado da mesa de corte.
              - Desenho da mesa de corte expandido verticalmente até logo abaixo do cabeçalho, com reserva lateral automática para não sobrepor a legenda.
              - Remoção das linhas `Refile:` e `Material Area:` do cabeçalho de todas as folhas (Canvas e PDF/Pillow).
              - **610 testes automatizados** (608 passando, 2 skip, 100% de aprovação).
            - **Impressão em Massa de Sessões e Pastas de Produção (v1.6.33)**:
              - Novo botão **🖨️ Imprimir Sessões** na barra de ações em lote (`batch_action_bar`).
              - Opções no menu de contexto da árvore: imprimir sessão individual, imprimir todas as sessões de uma pasta (e subpastas recursivamente), imprimir raiz de produção e imprimir sessões marcadas por checkbox.
              - Novos itens no menu superior: **Arquivo ➔ 🖨️ Imprimir Sessão...** e **🖨️ Imprimir em Massa (Sessões)...**.
              - Suporte completo no `LayoutPrintDialog` a múltiplas sessões com metadados isolados (`_setup_material_metadata`), títulos com `[Sessão #ID - layXXXX.lay]`, numeração da placa no rodapé e indicador `Página X de Y (Sessão #ID)`.
              - Exportação unificada para PDF e impressão física em lote de todas as páginas.
              - **590 testes automatizados** (590 passando, 2 skip, 0 falhas).
            - **Paginação e Navegação Multi-Página na Impressão A4 (v1.6.32)**:
              - Suporte a múltiplas páginas e navegação no diálogo de impressão (`LayoutPrintDialog`).
              - Botões **⬅ Anterior** e **Próxima ➡** na barra de ferramentas.
              - Atalhos de navegação por teclado: **Page Up** e **Page Down**.
              - Indicador `Página X de Y` e sincronização imediata no preview e exportação.
            - **Exportação em Massa e de Pastas para Máquina (v1.6.30 - v1.6.31)**:
              - Exportação de pastas de produção completas (`export_job_folder_sessions`) com subpastas, layouts e moldes.
              - Exportação de múltiplas sessões selecionadas via barra de ações em lote e menu de contexto.
            - **Exportação de sessão multi-placa para a máquina (v1.6.29)**:
              - Novo botão **📤** na toolbar do Layout Editor e item **Arquivo → 📤 Salvar Sessão para Máquina…**.
              - Exporta **todas as placas** da sessão (`lay0000.lay`, `lay0001.lay`, ...) para uma pasta de rede ou pendrive, com apenas os moldes realmente referenciados em `Shapes/`.
              - Escolha livre do destino, com memorização da última pasta; manifesto `manifest.json` com placas, moldes, hash e avisos; lista de moldes ausentes.
              - Exportação automática opcional no **Auto-Nest em Massa**, com destino persistido.
              - CLI de apoio: `python tools/export_session.py --session <id> --target <pasta> [--cac arquivo.cac]`.
              - Build inclui `cad.project_packager` como hidden import no PyInstaller.
              - Correção de build: `tools/clean_database.py` passou a ser versionado (antes era ignorado por `tools/*`) e com saída ASCII para o console Windows, evitando falha no passo de limpeza.
              - **572 testes automatizados** (572 passando, 2 skip, 0 falhas).
            - **Novidades da v1.6.28 (mantidas)**: higienização de banco pré/pós-atualização e limpeza de layouts de teste.
            - **Novidades da v1.6.27 (mantidas)**: persistência da última sessão ativa, fechamento seguro e importação atômica de `.lay`.
            - **Fechamento do buraco da placa 0 pós-separação de sobras (v1.6.26)**:
              - Após a separação das sobras de 4 camadas em ponta de 2 camadas, o `_recompact_plate` gerava um buraco de ~36 × 20 cm na placa 0.
              - Agora roda um segundo passe de preenchimento de vãos logo após a separação de sobras (grade fina 20 mm, passo 5 mm, 4 s).
              - Encaixa peças de 4 camadas da última placa nos vãos das anteriores sem tocar na ponta de 2 camadas nem na linha azul (`tip_zone`).
              - Otimizado com Spatial Hash Grid (100 mm) + lookup O(1) de ocupação preliminar, alternância 0°/180° e limite de altura da placa.
              - Medição (6 moldes × 101 pares, 1,37 × 2,82 m): placa 0 fecha com 224 peças (recuperando as 4 peças transferidas da última placa), buraco 100% fechado, conservação física estrita mantida ($4N_4 + 2N_2 = 2P$).
              - **562 testes automatizados** (562 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.25 (mantidas)**: preenchimento de vãos usa a área real das peças.
            - **Peça nunca é deitada (só 0°/180°)**:
              - O passe de preenchimento de vãos testava 90°/270°; as peças que ele movia só cabiam deitadas — corrigido.
              - O macro da IA-teste também passou a usar apenas 0°/180°.
              - Confirmado no motor principal: 100% das peças em 0°/180°.
              - **561 testes automatizados** (560 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.23 (mantidas)**: preenchimento de vãos (com a regra corrigida).
            - **Vãos entre placas são preenchidos (menos desperdício)**:
              - O motor deixava um bolsão no canto da placa e mandava as peças restantes para a placa seguinte.
              - Novo passe `preencher_buracos_em_placas()`: peças de 4 camadas da última placa passam a ocupar os vãos das anteriores (0/90/180/270°, gap respeitado); se a última placa esvaziar, ela é removida.
              - Medição (6 moldes × 101 pares, 1,37 × 2,82 m): placa 0 de 78,01% para **79,90%** (231 → 236 peças), sem criar nem perder peças.
              - **540 testes automatizados** (539 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.22 (mantidas)**: cabeçalho de folhas só na placa com ponta.
            - **Cabeçalho de folhas apenas na placa com a ponta**:
              - A placa 0 (sem ponta) continua com `Dimensions` + `Material Area`, exatamente como antes.
              - A placa com ponta de 2 camadas mostra `2 folhas longas ... m. 2 camadas` e `2 folhas curtas: ... m. 2 camadas`, sem `Material Area`.
              - **536 testes automatizados** (535 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.21 (mantidas)**: folhas longas/curtas em metros.
            - **Cabeçalho da impressão com as folhas longas e curtas**:
              - A linha `Dimensions` virou duas linhas em metros: `2 folhas longas 1,35 x 1,13 m. 2 camadas` e `2 folhas curtas: 1,35 x 0,88 m. 2 camadas` (a curta já desconta a ponta de 2 camadas).
              - A linha `Material Area:` foi removida (visualização, PDF e imagem).
              - **533 testes automatizados** (532 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.20 (mantidas)**: linha Description removida.
            - **Linha "Description" removida da impressão**:
              - O cabeçalho das folhas (visualização, PDF e imagem) não exibe mais `Description: fn98 - v1.2.36 - 12.09.2012`.
              - Permanecem Layout, Material, Dimensions, áreas, Refile e a linha de Shapes/Instances/Gap/Enfesto.
              - **530 testes automatizados** (529 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.19 (mantidas)**: clamp da ponta na miniatura.
            - **Linha azul da ponta não vaza mais na miniatura (aba Layout)**:
              - O refile feito no editor mantinha a ponta com as medidas da chapa cheia; a miniatura desenhava o retângulo azul fora do contorno e salvava o valor errado.
              - Agora existe uma regra única (`clamp_tip_zone`) usada no refile do editor, na miniatura da sessão, no refile automático e no PDF.
              - **529 testes automatizados** (528 passando, 1 skip, 0 falhas), incluindo verificação de que o retângulo azul fica dentro da chapa na miniatura.
            - **Novidades da v1.6.18 (mantidas)**: salvar o refile de verdade no Ctrl+S.
            - **Refile agora fica salvo de verdade (Ctrl+S)**:
              - O editor já gravava as dimensões refiladas, o corte CAM e a ponta no banco, mas a sessão em memória continuava com o tamanho antigo e sobrescrevia tudo na próxima gravação.
              - Agora a lista de placas é sincronizada e persistida ao salvar; a aba Layout mostra todas as placas (antes era reduzida a uma linha).
              - **527 testes automatizados** (526 passando, 1 skip, 0 falhas), com 2 novos cobrindo refile + salvamento.
            - **Novidades da v1.6.17 (mantidas)**: linha azul da ponta no PDF e metragem em metros.
            - **PDF de impressão: linha azul da ponta corrigida e tudo em metros**:
              - A ponta de 2 camadas era desenhada com as coordenadas da chapa **antes** do refile, vazando para fora da placa; agora é limitada à chapa (e descartada quando o refile corta a ponta).
              - No PDF a borda era sólida e grossa (o Pillow não tem tracejado): passou a ser tracejada fina, igual à tela.
              - Texto do almoxarifado em metros com vírgula: `2 folhas longas de 1,13 × 1,35 m + 2 folhas curtas, SEM cobrir a ponta de 1,35 × 0,33 m`.
              - **525 testes automatizados** (524 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.16 (mantidas)**: cabeçalho e régua em metros.
            - **Impressão A4 padronizada em METROS**:
              - Cabeçalho passa a mostrar `Dimensions: 1,13 x 1,35 m` (antes misturava cm e m).
              - Régua da chapa numerada em metros: `0,1 / 0,2 / 0,3 ...` (grade continua de 100 mm).
              - Vale para a visualização, o PDF e a exportação de imagem.
              - **520 testes automatizados** (519 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.15 (mantidas)**: impressão abre por Ctrl+P e pelo ícone.
            - **Impressão do layout voltou a abrir (Ctrl+P e ícone "Imprimir Layout")**:
              - O cálculo de área lia o contorno como tupla, mas o editor usa `{"x","y"}`; o `KeyError` estourava dentro do callback do Tk e era engolido — nada acontecia.
              - Corrigido com helper tolerante aos dois formatos; falhas agora mostram mensagem ao operador.
              - Removidos os números falsos do fallback (rendimento 83,02% fixo quando não havia peças).
              - **517 testes automatizados** (516 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.14 (mantidas)**: base recompactada após separar as sobras.
            - **Sem buraco na placa de 4 camadas após separar as sobras**:
              - A vaga da peça que ia para a ponta de 2 camadas era perdida; agora a base é **reencaixada** automaticamente, fechando os vãos.
              - Medição (6 moldes, 101 pares, 4 camadas): vãos 4 → **0**, altura 2.424 → **2.271 mm**, total físico continua exato (`2P`).
              - Com a base compacta, a divisão automática passou a usar 1 dobra (294 peças em 4c + 18 em 2c) em vez de 300/6.
              - **512 testes automatizados** (511 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.13 (mantidas)**: `--criar-atalho` e atalho versionado.
            - **`--criar-atalho`: cria/atualiza o atalho versionado quando não existe**:
              - `./corteac_linux --criar-atalho` cria `CorteAC-<versão>` no menu e na Área de Trabalho (inclusive no padrão pt-BR `~/Área de Trabalho`), remove versões antigas e instala o ícone em `~/.local/share/corteac/corteac.png`.
              - A abertura normal continua apenas **atualizando** atalhos existentes (não cria ícones sem pedido).
              - **509 testes automatizados** (508 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.12 (mantidas)**: sincronização automática do atalho na abertura.
            - **O ícone/nome do atalho se atualiza sozinho ao abrir o CorteAC**:
              - Antes era preciso rodar o `instalar_atalho.sh`; agora, ao iniciar, o app procura qualquer atalho do CorteAC (menu, `Desktop`, `Área de Trabalho`) e o substitui por `CorteAC-<versão>` com o ícone do pacote.
              - Corrigido o caminho pt-BR do Mint (`~/Área de Trabalho`), que antes não era encontrado.
              - Atalhos manuais antigos (`CorteAC.desktop`) também são migrados; se não existir atalho, nada é criado.
              - Se o ambiente tiver cache, F5 na Área de Trabalho ou sair/entrar na sessão.
              - **509 testes automatizados** (508 passando, 1 skip, 0 falhas).
            - **Novidades da v1.6.11 (mantidas)**: atalho versionado no Linux e no Windows.
            - **Atalho da Área de Trabalho com a versão no nome (ex.: `CorteAC-1.6.11`)**:
              - Linux: `instalar_atalho.sh` gera `corteac-<versão>.desktop` com o nome versionado, o ícone do pacote e remove automaticamente o atalho da versão anterior.
