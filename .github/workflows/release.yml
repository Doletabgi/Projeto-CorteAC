name: Release CorteAC (Windows & Linux)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão SemVer (ex: v1.0.0)'
        required: false
        default: 'v1.6.43'

permissions:
  contents: write

# master, main e a tag disparam o mesmo release: serializa para não criar/atualizar
# a release em paralelo (era a causa de falhas e de assets faltando).
concurrency:
  group: corteac-release
  cancel-in-progress: false

jobs:
  build-windows:
    name: Compilar Binário Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Limpar Banco de Dados para Release
        run: |
          python tools/clean_database.py

      - name: Compilar Executável Standalone com PyInstaller
        run: |
          pyinstaller --clean --onefile --noconsole --icon "assets/app_icon.ico" --add-data "assets;assets" --add-data "samples;samples" --add-data "jobmanager.db;." --add-data "db.example.ini;." --hidden-import pymysql --hidden-import cryptography --hidden-import cad.project_packager --hidden-import cad.barcode --hidden-import cad.layout_converter --hidden-import cad.czlib --hidden-import cad.onx_exporter --hidden-import cad.dual_exporter --hidden-import cad.shape_backup --hidden-import ui.user_dialog --hidden-import ui.layout_converter_dialog --hidden-import ui.shape_backup_restore_dialog --name "CorteAC" main.py

      - name: Empacotar Pacote Portátil ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package\CorteAC" -Force
          Copy-Item "dist\CorteAC.exe" -Destination "dist_package\CorteAC\"
          Copy-Item "README_WINDOWS.txt" -Destination "dist_package\CorteAC\"
          Copy-Item "db.example.ini" -Destination "dist_package\CorteAC\"
          Copy-Item "packaging\criar_atalho_windows.ps1" -Destination "dist_package\CorteAC\"
          python -c "import config; open('dist_package/CorteAC/versao.txt','w').write(config.APP_VERSION)"
          python -c "import config; open('versao.txt','w').write(config.APP_VERSION)"
          Compress-Archive -Path "dist_package\CorteAC\*" -DestinationPath "dist\CorteAC-Windows-x64.zip"

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/CorteAC.exe
            dist/CorteAC-Windows-x64.zip
          retention-days: 7

  build-linux:
    name: Compilar Binário Linux (Standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Limpar Banco de Dados para Release
        run: |
          python3 tools/clean_database.py

      - name: Compilar Executável Standalone Linux com PyInstaller
        run: |
          pyinstaller --clean --onefile --add-data "assets:assets" --add-data "samples:samples" --add-data "jobmanager.db:." --add-data "db.example.ini:." --hidden-import pymysql --hidden-import cryptography --hidden-import cad.project_packager --hidden-import cad.barcode --hidden-import cad.layout_converter --hidden-import cad.czlib --hidden-import cad.onx_exporter --hidden-import cad.dual_exporter --hidden-import cad.shape_backup --hidden-import ui.user_dialog --hidden-import ui.layout_converter_dialog --hidden-import ui.shape_backup_restore_dialog --name "corteac_linux" main.py

      - name: Empacotar Pacote Portátil TAR.GZ
        run: |
          mkdir -p dist_linux/CorteAC
          cp dist/corteac_linux dist_linux/CorteAC/
          cp README_LINUX.txt dist_linux/CorteAC/
          cp run.sh dist_linux/CorteAC/
          cp db.example.ini dist_linux/CorteAC/
          cp assets/app_icon.png dist_linux/CorteAC/corteac.png
          VERSAO_APP="$(python3 -c "import config; print(config.APP_VERSION)")"
          sed "s/@VERSAO@/${VERSAO_APP}/g" packaging/instalar_atalho.sh > dist_linux/CorteAC/instalar_atalho.sh
          chmod +x dist_linux/CorteAC/corteac_linux dist_linux/CorteAC/run.sh dist_linux/CorteAC/instalar_atalho.sh
          tar -czf dist/CorteAC-Linux-x64.tar.gz -C dist_linux CorteAC

      - name: Upload Artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/corteac_linux
            dist/CorteAC-Linux-x64.tar.gz
          retention-days: 7

  publish-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Código para Referência
        uses: actions/checkout@v4

      - name: Criar Diretório de Distribuição
        run: mkdir -p dist-release

      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/windows

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release/linux

      - name: Determinar Nome da Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import config; print(config.APP_VERSION)")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CorteAC ${{ steps.release_tag.outputs.tag }} (Windows & Linux)
          # Sem allowUpdates o run que encontra a release já criada FALHA
          # (era o caso dos pushes de master/main/tag na mesma versão).
          allowUpdates: true
          overwrite_files: true
          body: |
            # CorteAC — Lançamento Oficial para Windows 10/11 e Linux 64-bit

            Versões executáveis compiladas e prontas para testes em produção. Não é necessário instalar Python nem configurar terminal.

            ---

            ### 🪟 Para Usuários Windows (Windows 10 e Windows 11):
            1. Baixe o pacote **`CorteAC-Windows-x64.zip`** (ou diretamente o **`CorteAC.exe`**) abaixo na seção **Assets**.
            2. Extraia o `.zip` em qualquer pasta (ex: Área de Trabalho ou `C:\CorteAC`).
            3. Dê dois cliques no **`CorteAC.exe`**.
            4. O banco SQLite local (`jobmanager.db`) é inicializado automaticamente na pasta ao iniciar.

            *Nota SmartScreen: Se o Windows exibir a tela de proteção, clique em "Mais informações" e depois em "Executar assim mesmo".*

            ---

            ### 🐧 Para Usuários Linux (Ubuntu, Mint, Debian, Fedora, etc.):
            1. Baixe o pacote **`CorteAC-Linux-x64.tar.gz`** (ou diretamente o **`corteac_linux`**).
            2. Extraia os arquivos e no terminal execute:
               ```bash
               chmod +x ./corteac_linux
               ./corteac_linux
               ```
            3. O sistema abre a interface gráfica nativa imediatamente.

            ---

            ### 🛠️ Recursos Incluídos Nesta Versão (v1.6.43):
            - **Ferramenta de Backup e Restauração de Moldes Cadastrados no Menu Ferramentas**:
              - Nova ferramenta completa acessível diretamente em **Ferramentas ➔ 📦 Backup e Restauração de Moldes...**.
              - **Exportação Atômica**: Gera pacotes compactados padronizados (`.zip` / `.csh`) contendo `manifest.json`, `shapes.json` canônico (geometrias poligonais $X, Y$, furos, costuras, tamanhos e formato de molde `1x1`, `4x1`, `6x1`), catálogo de pastas (`folders.json`) e artigos (`articles.json`).
              - **Interoperabilidade ATOM FlashCut**: Opção para incluir cópias individuais em formato `.die` dentro do pacote ZIP, permitindo abrir os moldes exportados tanto no CorteAC quanto em máquinas industriais antigas e softwares CAM externos.
              - **Inspeção Prévia e Pré-visualização**: Validação de integridade do arquivo antes de restaurar, com exibição de versão de origem, data do backup, total de moldes, artigos e tabela detalhada de peças. Suporte a ZIPs legados de arquivos `.die`.
              - **Resolução Inteligente de Conflitos**: Estratégias configuráveis pelo operador ao restaurar moldes já existentes: *Substituir existentes* (atualiza contornos mantendo histórico), *Ignorar existentes* (preserva base atual intacta) ou *Criar cópias renomeadas* (`molde_copia`).
              - **Sincronização em Tempo Real**: Recarregamento automático instantâneo da árvore de navegação e grade inferior da tela principal ao término da restauração, sem necessidade de reiniciar a aplicação.
            - **Identificação da(s) Placa(s) dos Moldes/Números na Barra Lateral do Layout Editor**:
              - Abaixo do mostrador de contagem (`{n}/{m}`), linha informativa exibindo diretamente em qual placa cada número ou molde está alocado na sessão (`Placa 1`, `Placa 2`, `Placa 1, 2` ou `Sem placa`) com código de cores e mensagem orientativa ao clicar.
            - **Deslocamento de Exportar G-Code da Toolbar para o Menu Ferramentas**:
              - Botão `💾 Exportar G-Code` movido para a aba Ferramentas, mantendo a barra de ferramentas superior compacta e organizada.
            - **Conversor de Arquivos de Corte (.lay ⇄ .onx) no Menu Ferramentas**:
              - Conversão bidirecional entre os padrões industriais **ATOM FlashCut (`.lay`)** e **Comelz CNC (`.onx`)** com processamento em lote.
            - **Estabilidade e Testes**:
              - Suíte expandida para **663 testes automatizados** passando com 100% de sucesso.
          files: |
            dist-release/**/*.exe
            dist-release/**/*.zip
            dist-release/**/*.tar.gz
            dist-release/**/corteac_linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
