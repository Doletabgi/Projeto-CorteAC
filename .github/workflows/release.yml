name: Release CorteAC (Windows & Linux)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão SemVer (ex: v1.0.0)'
        required: false
        default: 'v1.5.1'

permissions:
  contents: write

# master, main e a tag disparam o mesmo release: serializa para não criar/atualizar
# a release em paralelo (era a causa de falhas e de assets faltando).
concurrency:
  group: corteac-release
  cancel-in-progress: false

jobs:
  build-windows:
    name: Compilar Binário Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável Standalone com PyInstaller
        run: |
          pyinstaller --clean --onefile --noconsole --icon "assets/app_icon.ico" --add-data "assets;assets" --add-data "samples;samples" --add-data "jobmanager.db;." --add-data "db.example.ini;." --hidden-import pymysql --hidden-import cryptography --name "CorteAC" main.py

      - name: Empacotar Pacote Portátil ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package\CorteAC" -Force
          Copy-Item "dist\CorteAC.exe" -Destination "dist_package\CorteAC\"
          Copy-Item "README_WINDOWS.txt" -Destination "dist_package\CorteAC\"
          Copy-Item "db.example.ini" -Destination "dist_package\CorteAC\"
          Compress-Archive -Path "dist_package\CorteAC\*" -DestinationPath "dist\CorteAC-Windows-x64.zip"

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/CorteAC.exe
            dist/CorteAC-Windows-x64.zip
          retention-days: 7

  build-linux:
    name: Compilar Binário Linux (Standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável Standalone Linux com PyInstaller
        run: |
          pyinstaller --clean --onefile --add-data "assets:assets" --add-data "samples:samples" --add-data "jobmanager.db:." --add-data "db.example.ini:." --hidden-import pymysql --hidden-import cryptography --name "corteac_linux" main.py

      - name: Empacotar Pacote Portátil TAR.GZ
        run: |
          mkdir -p dist_linux/CorteAC
          cp dist/corteac_linux dist_linux/CorteAC/
          cp README_LINUX.txt dist_linux/CorteAC/
          cp run.sh dist_linux/CorteAC/
          cp db.example.ini dist_linux/CorteAC/
          chmod +x dist_linux/CorteAC/corteac_linux dist_linux/CorteAC/run.sh
          tar -czf dist/CorteAC-Linux-x64.tar.gz -C dist_linux CorteAC

      - name: Upload Artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/corteac_linux
            dist/CorteAC-Linux-x64.tar.gz
          retention-days: 7

  publish-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Código para Referência
        uses: actions/checkout@v4

      - name: Criar Diretório de Distribuição
        run: mkdir -p dist-release

      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/windows

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release/linux

      - name: Determinar Nome da Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import config; print(config.APP_VERSION)")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CorteAC ${{ steps.release_tag.outputs.tag }} (Windows & Linux)
          # Sem allowUpdates o run que encontra a release já criada FALHA
          # (era o caso dos pushes de master/main/tag na mesma versão).
          allowUpdates: true
          overwrite_files: true
          body: |
            # CorteAC — Lançamento Oficial para Windows 10/11 e Linux 64-bit

            Versões executáveis compiladas e prontas para testes em produção. Não é necessário instalar Python nem configurar terminal.

            ---

            ### 🪟 Para Usuários Windows (Windows 10 e Windows 11):
            1. Baixe o pacote **`CorteAC-Windows-x64.zip`** (ou diretamente o **`CorteAC.exe`**) abaixo na seção **Assets**.
            2. Extraia o `.zip` em qualquer pasta (ex: Área de Trabalho ou `C:\CorteAC`).
            3. Dê dois cliques no **`CorteAC.exe`**.
            4. O banco SQLite local (`jobmanager.db`) é inicializado automaticamente na pasta ao iniciar.

            *Nota SmartScreen: Se o Windows exibir a tela de proteção, clique em "Mais informações" e depois em "Executar assim mesmo".*

            ---

            ### 🐧 Para Usuários Linux (Ubuntu, Mint, Debian, Fedora, etc.):
            1. Baixe o pacote **`CorteAC-Linux-x64.tar.gz`** (ou diretamente o **`corteac_linux`**).
            2. Extraia os arquivos e no terminal execute:
               ```bash
               chmod +x ./corteac_linux
               ./corteac_linux
               ```
            3. O sistema abre a interface gráfica nativa imediatamente.

            ---

            ### 🛠️ Recursos Incluídos Nesta Versão (v1.5.1):
            - **Correção: Layout Editor mostrava o desenho diferente do mini-preview**:
              - Os caches de geometria e de colisão do editor usavam o endereço de memória do contorno (`id()`). Como a janela do editor é reaproveitada entre sessões, o Python recicla esse endereço e o editor passava a desenhar peças com a geometria de **outra** sessão — peças deformadas e uma faixa vermelha de falsa colisão.
              - Nova identidade por conteúdo do contorno + limpeza dos caches ao abrir/trocar de placa.
              - O editor agora mantém as **cores por tamanho** (paridade visual com o mini-preview) e a barra de título avisa quando há colisão real (`⚠ N peça(s) sobrepostas`).
              - **358 testes automatizados** (357 passando, 1 skip, 0 falhas).
            - **Recursos da v1.5.0 (mantidos)**:
            - **Motores de Nesting Repensados para Contornos Reais (ganho medido de 4x a 21x)**:
              - O motor NFP decompunha contornos de calçado (130-222 vértices) em ~150 partes convexas, gerando **24 mil polígonos por par de peças**. Agora contornos complexos usam encosto por busca binária (SAT), ~100x mais rápido e sem perder exatidão.
              - Colisão poligonal otimizada (`polygons_collide`): contenção decidida por um vértice, min/max inline e segmentos pré-computados por linha — 4,6x mais rápido.
              - `contact_placement_x/y` caem automaticamente para busca binária em contornos complexos (o motor IA-teste ficou **21x** mais rápido).
              - Resultado medido na sessão #156 (1.500 peças, placa 1,38 x 2,98 m): de **5 a 17 minutos travando a máquina** para **8,3 s**, com 5 placas, 79% de rendimento, **zero colisões** e **zero invasões de margem**.
            - **Medidas de Placa e Material em Metros (padrão do operador)**:
              - Dimensões exibidas e digitadas em metros com vírgula decimal (ex: `1,38 x 2,98 m`), em vez de centímetros ou milímetros.
              - Aplicado ao rótulo da mesa CAD, barra de status, miniatura de placa da sessão, relatório de impressão A4, diálogo de refile e resumo da sessão.
              - Novo módulo `ui/units.py` centraliza formatação e leitura (`1,38`, `1.38`, `2,99 m`), mantendo o banco em milímetros.
            - **Modo Automático com o Melhor Resultado Medido**:
              - O modo Automático passou a usar `flashnestsheet` + `HighYield`: 79,0% de rendimento contra 65,8% do motor anterior, com o mesmo tempo de cálculo.
            - **Robustez de UI e Orquestração**:
              - Orçamento global de tempo no nesting (120 s configurável) com parada limpa e placas parciais preservadas.
              - Progresso honesto por estimativa de densidade ("Calculando chapa X de Y") em vez de anunciar o limite de segurança.
              - Progresso atualizado sempre na thread principal do Tk (correção de thread safety), mantendo o botão **Cancelar** responsivo.
            - **Qualidade, Estabilidade e Testes**:
              - **357 testes automatizados** (356 passando, 1 skip, 0 falhas) e novo benchmark `tools/bench_real_shapes.py` com contornos reais de produção.
          files: |
            dist-release/**/*.exe
            dist-release/**/*.zip
            dist-release/**/*.tar.gz
            dist-release/**/corteac_linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
