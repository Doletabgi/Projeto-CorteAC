name: Release CorteAC (Windows & Linux)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão SemVer (ex: v1.0.0)'
        required: false
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Binário Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável Standalone com PyInstaller
        run: |
          pyinstaller --clean --onefile --noconsole --icon "assets/app_icon.ico" --add-data "assets;assets" --add-data "samples;samples" --add-data "jobmanager.db;." --add-data "db.example.ini;." --hidden-import pymysql --hidden-import cryptography --name "CorteAC" main.py

      - name: Empacotar Pacote Portátil ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package\CorteAC" -Force
          Copy-Item "dist\CorteAC.exe" -Destination "dist_package\CorteAC\"
          Copy-Item "README_WINDOWS.txt" -Destination "dist_package\CorteAC\"
          Copy-Item "db.example.ini" -Destination "dist_package\CorteAC\"
          Compress-Archive -Path "dist_package\CorteAC\*" -DestinationPath "dist\CorteAC-Windows-x64.zip"

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/CorteAC.exe
            dist/CorteAC-Windows-x64.zip
          retention-days: 7

  build-linux:
    name: Compilar Binário Linux (Standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável Standalone Linux com PyInstaller
        run: |
          pyinstaller --clean --onefile --add-data "assets:assets" --add-data "samples:samples" --add-data "jobmanager.db:." --add-data "db.example.ini:." --hidden-import pymysql --hidden-import cryptography --name "corteac_linux" main.py

      - name: Empacotar Pacote Portátil TAR.GZ
        run: |
          mkdir -p dist_linux/CorteAC
          cp dist/corteac_linux dist_linux/CorteAC/
          cp README_LINUX.txt dist_linux/CorteAC/
          cp run.sh dist_linux/CorteAC/
          cp db.example.ini dist_linux/CorteAC/
          chmod +x dist_linux/CorteAC/corteac_linux dist_linux/CorteAC/run.sh
          tar -czf dist/CorteAC-Linux-x64.tar.gz -C dist_linux CorteAC

      - name: Upload Artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/corteac_linux
            dist/CorteAC-Linux-x64.tar.gz
          retention-days: 7

  publish-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Código para Referência
        uses: actions/checkout@v4

      - name: Criar Diretório de Distribuição
        run: mkdir -p dist-release

      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/windows

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release/linux

      - name: Determinar Nome da Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import config; print(config.APP_VERSION)")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CorteAC ${{ steps.release_tag.outputs.tag }} (Windows & Linux)
          body: |
            # CorteAC — Lançamento Oficial para Windows 10/11 e Linux 64-bit

            Versões executáveis compiladas e prontas para testes em produção. Não é necessário instalar Python nem configurar terminal.

            ---

            ### 🪟 Para Usuários Windows (Windows 10 e Windows 11):
            1. Baixe o pacote **`CorteAC-Windows-x64.zip`** (ou diretamente o **`CorteAC.exe`**) abaixo na seção **Assets**.
            2. Extraia o `.zip` em qualquer pasta (ex: Área de Trabalho ou `C:\CorteAC`).
            3. Dê dois cliques no **`CorteAC.exe`**.
            4. O banco SQLite local (`jobmanager.db`) é inicializado automaticamente na pasta ao iniciar.

            *Nota SmartScreen: Se o Windows exibir a tela de proteção, clique em "Mais informações" e depois em "Executar assim mesmo".*

            ---

            ### 🐧 Para Usuários Linux (Ubuntu, Mint, Debian, Fedora, etc.):
            1. Baixe o pacote **`CorteAC-Linux-x64.tar.gz`** (ou diretamente o **`corteac_linux`**).
            2. Extraia os arquivos e no terminal execute:
               ```bash
               chmod +x ./corteac_linux
               ./corteac_linux
               ```
            3. O sistema abre a interface gráfica nativa imediatamente.

            ---

            ### 🛠️ Recursos Incluídos Nesta Versão (v1.4.0):
            - **Feedback Visual de Nesting com Barra de Progresso e Bloqueio de Ação (Fase 6.5)**:
              - Barra de progresso indeterminada (`ttk.Progressbar`) e rótulo dinâmico na `SessionView`, exibidos sob demanda durante o cálculo de encaixe.
              - Bloqueio imediato dos botões `[Gerar]`, `[Em espera]` e `[Refazer]` prevenindo duplo clique e acessos concorrentes acidentais.
              - Alternância automática do cursor para ampulheta (`watch`) e medição exata do tempo de execução CAM em milissegundos exibida na barra de status.
              - Recuperação e encerramento resiliente (`hide_progress`) em cenários de sucesso, erro ou cancelamento.
            - **Novo Catálogo de Moldes (`ShapeCatalogView`) e Matriz Visual de Artigos**:
              - Consulta ultra-rápida (< 3 ms) via novo índice composto `idx_shapes_article_size_name` (migração `004_add_shapes_index.sql`).
              - Grade matricial organizada por moldes e tamanhos (do 22a ao 45) com renderização de contornos e atalhos rápidos.
            - **Arquitetura de Encaixe em 3 Camadas (`NestingModeWidget`)**:
              - **Camada 1 (Modos de Encaixe)**: Seleção ergonômica em 1 clique: Automático, Rápido, Econômico, Fitas, Retalhos e Personalizado (migração `003_add_session_nesting_mode.sql`).
              - **Camada 2 (Parâmetros Avançados)**: Ajuste detalhado de estratégias, presets DieProc e gaps.
              - **Camada 3 (Diagnóstico e Macros)**: Painel de depuração (`DebugPanel`) com profiler e painel de macros declarativas (`MacroPanel`).
            - **Trava de Segurança e Ergonomia no Shape Editor (`ShapeEditorView`)**:
              - Trava de proteção geométrica (`🔒 Editar Geometria` / `🔓 Geometria Destravada`) com alerta de confirmação prevenindo alterações acidentais em matrizes de produção.
              - Nova ferramenta de rotação de molde (`rotate`) e alternador visual de linhas de costura (`stitching`).
              - Suporte completo a tela cheia / maximização com atalho `<Escape>` e duplo clique na barra de título.
            - **Otimizações no Motor de Nesting (`cad/macro_engine.py`)**:
              - Simplificação poligonal inteligente via algoritmo Ramer-Douglas-Peucker (RDP) para contornos complexos (> 50 vértices).
              - Cache analítico de separação horizontal NFP (`_DX_SEP_CACHE`, `_POLY0_CACHE`, `clear_macro_caches`).
              - Modo estritamente determinístico no cérebro de IA por reforço (`NestingAIBrain: deterministic=True`).
            - **Qualidade, Estabilidade e Testes**:
              - **341 testes automatizados** (340 passando, 1 skip, 0 falhas) garantindo 100% de confiabilidade industrial.
          files: |
            dist-release/**/*.exe
            dist-release/**/*.zip
            dist-release/**/*.tar.gz
            dist-release/**/corteac_linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
