name: Release OpenCorte (Windows & Linux)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão SemVer (ex: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

# Uma publicação por tag; o push da branch não duplica a mesma release.
concurrency:
  group: corteac-release
  cancel-in-progress: false

jobs:
  build-windows:
    name: Compilar Binário Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar e empacotar com o atualizador central
        env:
          OPEN_CORTE_TAG: ${{ github.event.inputs.tag_name }}
        run: python atualizar.py --build

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/OpenCorte.exe
            dist/OpenCorte-Windows-x64.zip
            dist/OpenCorte-Setup-*.exe
          retention-days: 7


  build-linux:
    name: Compilar Binário Linux (Standalone)
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema e Python
        run: |
          # setup-python pode fornecer Tk/Tcl completos; só usa APT se necessário.
          if ! python -c "import tkinter; tkinter.Tcl().eval('info library')"; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get install -y python3-tk
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar e empacotar com o atualizador central
        env:
          OPEN_CORTE_TAG: ${{ github.event.inputs.tag_name }}
        run: python atualizar.py --build

      - name: Upload Artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/opencorte_linux
            dist/OpenCorte-Linux-x64.tar.gz
          retention-days: 7

  publish-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Baixar Código para Referência
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar Diretório de Distribuição
        run: mkdir -p dist-release

      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/windows

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release/linux

      - name: Determinar Nome da Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import config; print(config.APP_VERSION)")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Preparar alterações desta versão
        id: release_notes
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import uuid
          from pathlib import Path
          from atualizar import release_notes
          tag = os.environ['RELEASE_TAG']
          notes = release_notes(Path.cwd(), tag.removeprefix('v'), ref=tag)
          delimiter = 'NOTES_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'changes<<{delimiter}\n{notes}\n{delimiter}\n')
          PY

      - name: Remover cópia antiga do instalador sem versão
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner, repo, tag: process.env.RELEASE_TAG
              }));
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id
            });
            for (const asset of assets.filter(a => ['CorteAC-Setup.exe', 'OpenCorte-Setup.exe'].includes(a.name))) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              core.info(`Removido instalador sem versão: ${asset.name}`);
            }

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: OpenCorte ${{ steps.release_tag.outputs.tag }} (Windows & Linux)
          # Sem allowUpdates o run que encontra a release já criada FALHA
          # (era o caso dos pushes de master/main/tag na mesma versão).
          allowUpdates: true
          overwrite_files: true
          body: |
            # OpenCorte — Lançamento Oficial para Windows 10/11 e Linux 64-bit

            Versões executáveis compiladas e prontas para testes em produção. Não é necessário instalar Python nem configurar terminal.

            ---

            ### 🪟 Para Usuários Windows (Windows 10 e Windows 11):
            1. **Instalador Oficial com Suporte a Rede (Recomendado)**:
               - Baixe o instalador **`OpenCorte-Setup-<versão>.exe`** correspondente à versão desta release, abaixo na seção **Assets**.
               - Dê dois cliques e siga o assistente (permite configurar as pastas de Moldes e Sessões na rede da fábrica).
               - O instalador cria atalhos na Área de Trabalho e registra no Adicionar/Remover Programas.
            2. **Versão Portátil (.zip ou .exe direto)**:
               - Baixe o pacote **`OpenCorte-Windows-x64.zip`** (ou diretamente o **`OpenCorte.exe`**).
               - Extraia e dê dois cliques no **`OpenCorte.exe`**.
               - O banco SQLite local (`jobmanager.db`) é inicializado automaticamente na pasta ao iniciar.

            *Nota SmartScreen: Se o Windows exibir a tela de proteção, clique em "Mais informações" e depois em "Executar assim mesmo".*


            ---

            ### 🐧 Para Usuários Linux (Ubuntu, Mint, Debian, Fedora, etc.):
            1. Baixe o pacote **`OpenCorte-Linux-x64.tar.gz`** (ou diretamente o **`opencorte_linux`**).
            2. Extraia os arquivos e no terminal execute:
               ```bash
               chmod +x ./opencorte_linux
               ./opencorte_linux
               ```
            3. O sistema abre a interface gráfica nativa imediatamente.

            ---

            ### Alterações desta versão
            ${{ steps.release_notes.outputs.changes }}

            A compilação dos pacotes não substitui a homologação operacional em máquina.
          generate_release_notes: false
          files: |
            dist-release/**/OpenCorte.exe
            dist-release/**/OpenCorte-Setup-*.exe
            dist-release/**/*.zip
            dist-release/**/*.tar.gz
            dist-release/**/opencorte_linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
