name: Release CorteAC (Windows & Linux)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v2026.2)'
        required: false
        default: 'v2026.2'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Binário Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável Standalone com PyInstaller
        run: |
          pyinstaller --clean --onefile --noconsole --icon "assets/app_icon.ico" --add-data "assets;assets" --add-data "samples;samples" --add-data "jobmanager.db;." --add-data "db.example.ini;." --hidden-import pymysql --hidden-import cryptography --name "CorteAC" main.py

      - name: Empacotar Pacote Portátil ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package\CorteAC" -Force
          Copy-Item "dist\CorteAC.exe" -Destination "dist_package\CorteAC\"
          Copy-Item "README_WINDOWS.txt" -Destination "dist_package\CorteAC\"
          Copy-Item "db.example.ini" -Destination "dist_package\CorteAC\"
          Compress-Archive -Path "dist_package\CorteAC\*" -DestinationPath "dist\CorteAC-Windows-x64.zip"

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/CorteAC.exe
            dist/CorteAC-Windows-x64.zip
          retention-days: 7

  build-linux:
    name: Compilar Binário Linux (Standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável Standalone Linux com PyInstaller
        run: |
          pyinstaller --clean --onefile --add-data "assets:assets" --add-data "samples:samples" --add-data "jobmanager.db:." --add-data "db.example.ini:." --hidden-import pymysql --hidden-import cryptography --name "corteac_linux" main.py

      - name: Empacotar Pacote Portátil TAR.GZ
        run: |
          mkdir -p dist_linux/CorteAC
          cp dist/corteac_linux dist_linux/CorteAC/
          cp README_LINUX.txt dist_linux/CorteAC/
          cp run.sh dist_linux/CorteAC/
          cp db.example.ini dist_linux/CorteAC/
          chmod +x dist_linux/CorteAC/corteac_linux dist_linux/CorteAC/run.sh
          tar -czf dist/CorteAC-Linux-x64.tar.gz -C dist_linux CorteAC

      - name: Upload Artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/corteac_linux
            dist/CorteAC-Linux-x64.tar.gz
          retention-days: 7

  publish-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Código para Referência
        uses: actions/checkout@v4

      - name: Criar Diretório de Distribuição
        run: mkdir -p dist-release

      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/windows

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release/linux

      - name: Determinar Nome da Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2026.2" >> $GITHUB_OUTPUT
          fi

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CorteAC ${{ steps.release_tag.outputs.tag }} (Windows & Linux)
          body: |
            # CorteAC — Lançamento Oficial para Windows 10/11 e Linux 64-bit

            Versões executáveis compiladas e prontas para testes em produção. Não é necessário instalar Python nem configurar terminal.

            ---

            ### 🪟 Para Usuários Windows (Windows 10 e Windows 11):
            1. Baixe o pacote **`CorteAC-Windows-x64.zip`** (ou diretamente o **`CorteAC.exe`**) abaixo na seção **Assets**.
            2. Extraia o `.zip` em qualquer pasta (ex: Área de Trabalho ou `C:\CorteAC`).
            3. Dê dois cliques no **`CorteAC.exe`**.
            4. O banco SQLite local (`jobmanager.db`) é inicializado automaticamente na pasta ao iniciar.

            *Nota SmartScreen: Se o Windows exibir a tela de proteção, clique em "Mais informações" e depois em "Executar assim mesmo".*

            ---

            ### 🐧 Para Usuários Linux (Ubuntu, Mint, Debian, Fedora, etc.):
            1. Baixe o pacote **`CorteAC-Linux-x64.tar.gz`** (ou diretamente o **`corteac_linux`**).
            2. Extraia os arquivos e no terminal execute:
               ```bash
               chmod +x ./corteac_linux
               ./corteac_linux
               ```
            3. O sistema abre a interface gráfica nativa imediatamente.

            ---

            ### 🛠️ Recursos Incluídos Nesta Versão (v2026.2):
            - **Grade de Moldes com Coluna "Resto" (Paridade com Job Manager original)**:
              - Nova coluna **Resto** na grade de Moldes da Sessão de Corte (`SessionView`), posicionada entre **Pares** e **Sequência**.
              - Alinhamento compacto à direita (`anchor="e"`, largura 45px), modo somente leitura com preservação de integridade.
              - Recálculo dinâmico e reativo em tempo real com base nas camadas de corte do material ($-\lfloor(2 \times P \pmod L)/2\rfloor$): pares ímpares com 4 camadas geram `-1`, pares pares geram `0`.
              - Atualização automática instantânea tanto na digitação de pares (inclusive fluxo contínuo de digitação com setas do teclado) quanto na alteração das camadas do material na aba Materiais.
              - Navegação inteligente por teclado com `<Tab>` e `<Shift-Tab>` pulando a coluna Resto diretamente entre Pares e Sequência.
              - Ordenação numérica interativa clicável no cabeçalho "Resto", com suporte nativo a valores negativos (`-1 < 0`).
            - **Simulação de Corte CNC / CAM no Layout Editor**:
              - Painel de simulação CAM integrado ao Layout Editor com botões de Play, Pausa, Stop, velocidade ajustável e mira CNC em tempo real.
              - Rastreamento visual do percurso da lâmina e sequência de corte sobre a folha.
            - **Menu de Contexto Fill e Paridade de Diálogo (Dialog 159)**:
              - Menu de contexto de preenchimento completo: *Row*, *Row Alternate*, *Column*, *Sheet*, *Sheet Alternate*, *User*.
              - Diálogo modal *"Set User constraints"* para controle paramétrico de repetição e restrições.
            - **Identidade Visual e Relatórios Corporativos**:
              - Suporte a Logotipo Personalizado da Empresa para impressão de fichas de corte em A4 e exportação para PDF.
              - Barra de ferramentas clássica revitalizada com novos ícones em alta resolução.
            - **Performance e CAD Fluido**:
              - Arraste veloz de moldes a ~125 Hz com algoritmo de limitação de taxa de eventos para latência zero.
              - Rotação livre contínua em 360° com botão direito do mouse (`R-Drag`) e exibição do pivô em tempo real.
              - Seleção múltipla com caixa elástica (*rubberband*) e arrasto coletivo.
            - **Arquitetura de Dados Híbrida**:
              - Sistema de contingência SQLite local (`jobmanager.db`) e suporte a MySQL 8.0 corporativo em rede (`db.ini`).
          files: |
            dist-release/**/*.exe
            dist-release/**/*.zip
            dist-release/**/*.tar.gz
            dist-release/**/corteac_linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
