# Configuração do Banco de Dados Central - JobManager 2000 Reborn
# Copie este arquivo para 'db.ini' para configurar a máquina local.
# O arquivo 'db.ini' NUNCA deve ser commitado no repositório.

[database]
# Backend: "mysql" (padrão de fábrica, multi-usuário) ou "sqlite" (reserva local)
backend = mysql

# Parâmetros do servidor MySQL 8.0 Central
host = 127.0.0.1
port = 3306
user = jm_app
password = jm_factory_2026
database = jobmanager
charset = utf8mb4
connect_timeout = 5

# Configurações do pool / concorrência
pool_size = 10
max_overflow = 20

[sqlite]
# Caminho do banco local de reserva (somente para demonstração/emergência)
path = jobmanager.db
